name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run tests
        run: pio test -e native

      - name: Algorithms must not name hardware
        # Nothing under src/algorithm/ may include Arduino.h, name a GPIO pin
        # or a MIDI transport: only the hardware port nodes do that.
        run: |
          ! grep -rnE 'Arduino\.h|GPIO_PIN_|mmMIDI_|hardware\.h|hal/teensy|IGpio|IMidiOut' src/algorithm/

  firmware:
    name: Teensy 4.1 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.py runs `git describe`, which needs tags and
          # history that a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e teensy41

      - name: Report size
        run: pio run -e teensy41 -t size

      # Every build is downloadable, so a branch can be flashed and tried on
      # hardware without cutting a release for it. On a pull_request event
      # github.sha is the ephemeral merge commit, which names no commit on the
      # branch, so prefer the head SHA — the point of the artifact is to be
      # traceable to something you can check out.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .pio/build/teensy41/*.hex
            .pio/build/teensy41/*.elf
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Browser emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps `git describe` into the page like the firmware.
          fetch-depth: 0

      # The emulator compiles the firmware core to WebAssembly with a stock
      # clang; lld provides wasm-ld and llvm the nm used to check imports.
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Build
        run: emulator/build.sh

      # The same scenarios as test/test_master, driven through the wasm
      # module: proves the browser build behaves like the native one.
      - name: Smoke test the module
        run: node emulator/test/smoke.mjs

      # The editor is a client of the firmware's protocol, so it is checked
      # against the firmware: the generated protocol module must match the
      # headers, and the editor's codec and validator are driven against the
      # module compiled to WebAssembly over the real SysEx protocol. A
      # protocol change therefore breaks both at once, which is the reason
      # the editor lives in this repository (#12).
      - name: Check the editor against the firmware
        run: |
          node editor/tools/generate-protocol.mjs --check
          node editor/test/protocol.test.mjs

      # A single self-contained page: download, open, no server needed.
      - name: Upload the page
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: emulator/dist/index.html
          if-no-files-found: error
          retention-days: 14
