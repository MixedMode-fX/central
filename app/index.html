<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MMMC</title>
<!-- Inline, so the page makes no request for it: there is nothing else to
     fetch here but the modules and the module itself. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312141a'/%3E%3Cpath d='M3 11V5h2l1.5 3L8 5h2v6H8.5V7.5L7 10H6L4.5 7.5V11z' fill='%236ea8fe'/%3E%3Ccircle cx='12.5' cy='9.5' r='1.5' fill='%237bd88f'/%3E%3C/svg%3E">
<style>
  /* Mobile first, and not as a courtesy: the module embeds in this page, so a
     phone with no cable and no Web MIDI is a *fully working* editor and is the
     only one an iPhone can have. The wide layout is the enhancement.

     The rules that keep it honest on a narrow screen:
       * every flex and grid child gets min-width: 0. A grid or flex item is
         min-width: auto by default, which means "at least as wide as what is
         inside me" - and a 32-step lane is 925px of inside. That width
         propagates out through the node card and past the screen, where the
         overflow-x: hidden below *clips* it: the lane does not scroll in its
         box, it is simply unreachable, and so is half the card around it;
       * a pattern wraps onto as many rows as it needs rather than running off
         the side: a step you have to scroll to is a step you tap by mistake.
         Anything that genuinely cannot wrap - a bindings table, and a lane on
         a screen wide enough to hold the whole pattern on one line - lives in
         its own overflow-x container;
       * controls are at least 2.75rem tall, which is a finger rather than a
         mouse pointer;
       * a slider is never the only way to set a value. */
  :root {
    color-scheme: dark light;
    --bg: #12141a; --panel: #1b1e26; --raised: #232833; --line: #2c313d; --ink: #e6e9f0;
    --dim: #8b93a7; --accent: #6ea8fe; --gate: #7bd88f; --note: #d8a67b; --cv: #b78bd8;
    --bad: #ff8a8a; --warn: #e8c46a;
    --tap: 2.75rem;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  /* The children of every grid and flex container in this page, allowed to be
     narrower than their contents. Anything that then does not fit wraps, or
     scrolls in its own box - which is the difference between a card that fits
     the screen and one that is clipped off the side of it. */
  .nodes > *, .ports > *, .port-group > *, .params > *, .fields > *,
  .jack-cards > *, .routes > *, .slots > *, .saved-list > *, .lane-row > *,
  .players > *, .row > *, .grid > *, .legend > *, .param-section > *,
  .canvas-bar > *, .add-row > *, .details-bar > *, .route-side > *,
  .leg-body > *, .param.inline > * { min-width: 0; }
  /* Nothing may make the page itself scroll sideways: an overflowing lane
     scrolls in its own box or it is a bug. */
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .shell {
    max-width: 68rem; margin: 0 auto;
    padding: 1rem .75rem 5rem;
    padding-left: max(.75rem, env(safe-area-inset-left));
    padding-right: max(.75rem, env(safe-area-inset-right));
  }
  h1 { font-size: 1.15rem; margin: 0; }
  h2 { font-size: .8rem; margin: 0 0 .6rem; color: var(--dim);
       text-transform: uppercase; letter-spacing: .08em; }
  h2.spaced { margin-top: 1.4rem; }
  h3 { font-size: 1rem; margin: 0; }
  h4 { margin: 0 0 .3rem; font-size: .8rem; color: var(--dim);
       text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0 0 .6rem; }

  /* --- header and tabs --- */
  .top { display: grid; gap: .6rem; margin-bottom: .75rem; }
  .title { display: flex; align-items: baseline; gap: .6rem; min-width: 0; }
  .patch-name { color: var(--dim); font-size: .95rem; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .top-buttons { display: flex; gap: .5rem; flex-wrap: wrap; }
  .top-buttons button { flex: 1 1 auto; min-width: 0; }
  .status { color: var(--dim); font-size: .9rem; margin: 0; }
  .status.online { color: var(--gate); }
  .status.warn { color: var(--warn); }

  .tabs {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: .25rem; margin: 0 -.25rem 1rem;
    padding: .35rem .25rem; background: var(--bg);
    border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  /* A tab is an icon over its word: five of them fit a phone's width that
     way, and the icon is what the eye lands on once it has read the word
     once. */
  .tab {
    flex: 1 0 auto; min-height: var(--tap); padding: .25rem .7rem;
    display: inline-flex; flex-direction: column; align-items: center; gap: .1rem;
    background: none; border: 1px solid transparent; border-radius: var(--radius);
    color: var(--dim); font: inherit; cursor: pointer;
  }
  .tab .icon { width: 1.3rem; height: 1.3rem; }
  .tab-label { font-size: .72rem; line-height: 1.2; }
  .tab.active { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .tab.active .icon { color: var(--accent); }

  /* An icon button: square, the icon in `currentColor`, its word in the
     tooltip and the accessible name - or beside the icon where `.with-text`
     says there is room for it. */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    width: var(--tap); height: var(--tap); min-height: 0; padding: 0; flex: 0 0 auto;
  }
  .icon-btn .icon { width: 1.3rem; height: 1.3rem; display: block; flex: none; }
  .icon-btn.with-text { width: auto; padding: 0 .8rem 0 .6rem; }
  .icon-btn.ghost { color: var(--dim); }
  .icon-btn.ghost:hover { color: var(--ink); }
  .icon-btn.primary { color: var(--accent); }
  .top-buttons .icon-btn { flex: 1 1 auto; }

  /* --- controls --- */
  button, select, input, textarea { font: inherit; color: var(--ink); }
  button {
    min-height: var(--tap); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .4rem .9rem; cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--accent); }
  button:active { background: var(--raised); }
  button.ghost { background: none; border-color: transparent; color: var(--dim);
                 min-height: 2.25rem; padding: .2rem .6rem; }
  button.ghost:hover { color: var(--ink); border-color: var(--line); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.active { border-color: var(--gate); color: var(--gate); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  select {
    min-height: var(--tap); max-width: 100%;
    background: var(--raised); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .35rem .5rem;
  }
  input[type=number], input[type=text], textarea {
    min-height: var(--tap); background: var(--raised); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .35rem .5rem;
  }
  input.number { width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; }
  input.number.wide { width: 6rem; }
  .grow { flex: 1 1 8rem; min-width: 0; }
  label.file {
    display: inline-flex; align-items: center; min-height: var(--tap);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: .4rem .9rem; cursor: pointer;
  }
  label.file input { display: none; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row > * { min-width: 0; }

  /* A slider a finger can actually use: a tall, obvious thumb over a thin
     track, with room around it so a tap near the line still lands. */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    height: var(--tap); background: none; margin: 0; padding: 0;
    min-width: 0;
    /* A drag down the page is the page's, not the slider's. This is half of
       it; the other half is `slider` in views.js, because the browser hands
       the gesture over only *after* the input has already moved. */
    touch-action: pan-y;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line);
  }
  input[type=range]::-moz-range-track {
    height: 6px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: -11px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer;
  }
  input[type=checkbox].switch { width: 1.4rem; height: 1.4rem; accent-color: var(--accent); }
  .bool { display: inline-flex; gap: .5rem; align-items: center; min-height: var(--tap); }

  .chip {
    min-height: 2.4rem; padding: .25rem .7rem; border-radius: 999px;
    background: var(--raised); border: 1px solid var(--line); color: var(--dim);
    font-size: .85rem;
  }
  .chip.on { background: color-mix(in srgb, var(--accent) 22%, transparent);
             border-color: var(--accent); color: var(--ink); }
  .ports-row { display: flex; flex-wrap: wrap; gap: .35rem; }

  /* --- the picker: a dropdown you can read (picker.js) --- */
  /* The panel is positioned against the picker rather than the page, so it
     moves with the layout and needs nothing measured in JavaScript. It is
     the width of the control on a phone and no wider than a paragraph on a
     desktop, because a row here is two lines of prose and a 60rem line is
     not read, it is scanned past. */
  .picker { position: relative; min-width: 0; }
  .picker-face {
    display: flex; width: 100%; gap: .5rem; align-items: center;
    background: var(--raised); text-align: left;
  }
  .picker-face[aria-expanded="true"] { border-color: var(--accent); }
  .picker-face-text { display: flex; gap: .5rem; align-items: baseline;
                      flex-wrap: wrap; min-width: 0; margin-right: auto; }
  .picker-caret { color: var(--dim); flex: none; }
  .picker-name { overflow-wrap: anywhere; }
  .picker-note { color: var(--dim); font-size: .78rem; white-space: nowrap; }
  .picker-panel {
    position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + .3rem);
    display: flex; flex-direction: column;
    max-width: 34rem; max-height: min(60vh, 26rem);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); overflow: hidden;
  }
  /* Opened upwards, when there is more room above than below - which is what
     the add bar at the foot of the patch tab always has. */
  .picker-panel.up { top: auto; bottom: calc(100% + .3rem); }
  .picker-search { margin: .4rem; }
  .picker-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .picker-shelf { min-width: 0; }
  .picker-group {
    position: sticky; top: 0; z-index: 1; padding: .35rem .7rem;
    background: var(--panel); border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
  }
  .picker-option {
    display: grid; width: 100%; gap: .15rem; padding: .45rem .7rem; min-height: var(--tap);
    background: none; border: none; border-radius: 0; text-align: left; cursor: pointer;
  }
  .picker-option-head { display: flex; gap: .5rem; align-items: baseline;
                        justify-content: space-between; }
  .picker-hint { color: var(--dim); font-size: .78rem; line-height: 1.35; }
  .picker-option.chosen .picker-name { color: var(--accent); }
  .picker-option.active, .picker-option:hover {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .picker-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .picker-empty { padding: .6rem .7rem; color: var(--dim); font-size: .85rem; }

  /* --- boxes --- */
  .caps { color: var(--dim); font-size: .85rem; margin-bottom: 1rem; }
  .hint { color: var(--dim); font-size: .85rem; }
  .error, .problems, .notes {
    border-radius: var(--radius); padding: .7rem .8rem; margin-bottom: 1rem; border: 1px solid;
  }
  .error { border-color: var(--bad); color: var(--bad); cursor: pointer; }
  .problems { border-color: var(--bad); }
  .problems h4 { color: var(--bad); }
  .notes { border-color: var(--warn); }
  .notes h4 { color: var(--warn); }
  .problems ul, .notes ul { margin: 0; padding-left: 1.1rem; }
  .problems li, .notes li { overflow-wrap: anywhere; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: .9rem; margin-bottom: 1rem; }

  /* --- nodes --- */
  .nodes { display: grid; gap: 1rem; }
  .node { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .9rem; }
  .node.bad { border-color: var(--bad); }
  .node header { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; flex-wrap: wrap; }
  .node-index {
    background: var(--line); border-radius: 5px; padding: .05rem .5rem;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .tag { font-size: .7rem; color: var(--accent); border: 1px solid var(--accent);
         border-radius: 4px; padding: 0 .35rem; }
  .node header button { margin-left: auto; }

  /* A port is one line: its name, and the bus it is on. The name used to sit
     on a line of its own above the selector, which cost a card with five ports
     five lines of nothing but names - and the name is two words, not a
     paragraph, so it fits beside the control at every width the page supports.
     What it says about its bus goes under it, in the smaller type of an aside,
     because it is an observation rather than a setting. */
  .ports { display: grid; gap: .7rem; margin-bottom: .7rem; }
  .port-group { min-width: 0; display: grid; gap: .35rem; align-content: start; }
  .port { min-width: 0; padding-left: .55rem; border-left: 3px solid var(--line); }
  .port-head { display: grid; grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr);
               gap: .5rem; align-items: center; }
  .port-name { color: var(--ink); font-size: .85rem; overflow-wrap: anywhere; }
  .port-name .required { color: var(--warn); margin-left: .15rem; }
  .port select { width: 100%; }
  .wire { display: block; color: var(--dim); font-size: .74rem; line-height: 1.35;
          margin-top: .1rem; overflow-wrap: anywhere; }
  .wire.empty { color: var(--warn); }
  .bus-gate { border-left-color: var(--gate); }
  .bus-note { border-left-color: var(--note); }
  .bus-CV   { border-left-color: var(--cv); }

  /* --- parameters --- */
  .params { display: grid; gap: .5rem; }
  .param { min-width: 0; }
  /* A choice is one line: the select or the switch says what it is set to, so
     the name has nothing to share its row with and sits beside the control
     instead of above it. An amount keeps two lines - see `.param-controls`. */
  .param.inline { display: grid; grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr);
                  gap: .5rem; align-items: center; }
  .param-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  /* Name at the left, everything the parameter currently *is* at the right. */
  .param-name { color: var(--dim); font-size: .85rem; margin-right: auto; }
  .param-cc { color: var(--accent); font-size: .7rem; letter-spacing: .04em;
              font-variant-numeric: tabular-nums; }
  .param-value { font-variant-numeric: tabular-nums; font-size: .85rem; text-align: right; }
  .param-controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; min-width: 0; }
  .param-controls > .grow { flex: 1 1 4rem; }
  /* One row: slider, value, learn. The slider used to take a row of its own
     because the row it shared left it about 130px on a phone - two values of
     a 0..255 parameter per pixel, which is not a control, it is a lottery.
     What buys that width back on one line is the company it keeps: a number
     field only as wide as three digits, and a learn button that is an icon
     rather than a word. The slider takes everything they leave. */
  .param-controls .slider { flex: 1 1 6rem; min-width: 0; }
  /* Three digits wide, and no spinners: they are a mouse's affordance that
     costs a phone the width of two of those digits, and the slider beside the
     field already steps the value. */
  .param-controls .number { width: 3.75rem; -moz-appearance: textfield; appearance: textfield; }
  .param-controls .number::-webkit-inner-spin-button,
  .param-controls .number::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  /* A square button around a square icon, at the same height as the field
     beside it so the row sits on one baseline. */
  button.learn {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: var(--tap); height: var(--tap); min-height: 0; padding: 0;
    border-color: var(--line); color: var(--dim);
  }
  button.learn .icon { width: 1.35rem; height: 1.35rem; display: block; }
  button.learn:hover { color: var(--ink); border-color: var(--accent); }
  .learn.bound { color: var(--accent); border-color: var(--accent); }
  /* An armed learn is the one thing on the card that is *waiting*. It says so
     in the accent, and where motion is welcome it also breathes: nothing else
     on the page does, so there is nothing to confuse it with. */
  .learn.armed { color: var(--accent); border-color: var(--accent);
                 background: color-mix(in srgb, var(--accent) 18%, transparent); }
  /* The CV route button is the same square: bound is the CV colour, because
     what it is bound to is a control signal. */
  button.learn.cv.bound { color: var(--cv); border-color: var(--cv); }
  .param-cc.dom-CV { color: var(--cv); }
  .param-value.dom-CV { color: var(--cv); }
  .param-menu-item.chosen .param-menu-name { color: var(--cv); }
  .param-menu-item.danger { color: var(--bad); }
  /* The sections a card's parameters are sorted into: one question each,
     in the same order on every node. */
  .param-sections { display: grid; gap: .7rem; }
  .param-section h4 { margin-bottom: .35rem; padding-bottom: .2rem; border-bottom: 1px solid var(--line); }
  .node .summary { margin-bottom: .6rem; font-size: .8rem; }
  /* A modulation route is a different row: its depth slider shares with a
     mode select and a percentage, and there is no width left to share. */
  .mod-route .param-controls .slider { flex: 1 0 100%; }

  /* --- the key's keyboard --- */
  /* Two octaves from C, with the notes of the key lit and its root ringed:
     the one place in the app where a scale is a shape rather than a word. The
     black keys are positioned against the row rather than laid out in it,
     because that is the only way a piano's geometry comes out right. */
  .keyboard {
    position: relative; display: flex; height: 7.5rem;
    margin: .2rem 0 .5rem; touch-action: manipulation;
  }
  .kb-key {
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 0 .3rem; font-size: .72rem; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); cursor: pointer; min-height: 0; min-width: 0;
  }
  .kb-white {
    flex: 1 1 0; background: var(--raised); color: var(--dim);
    border-radius: 0 0 5px 5px;
  }
  .kb-black {
    position: absolute; top: 0; height: 62%; width: 4.5%; z-index: 1;
    transform: translateX(-50%);
    background: var(--bg); color: var(--dim); border-radius: 0 0 4px 4px;
  }
  .kb-key.in { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .kb-black.in { filter: brightness(.72); }
  /* Inside the key rather than around it, so the ring does not widen a black
     key over the white one beside it. */
  .kb-key.root { outline: 2px solid var(--note); outline-offset: -2px; }
  .kb-notes { margin: 0 0 .8rem; }

  .fields { display: grid; gap: .7rem; margin-bottom: .8rem; }
  .field { display: grid; gap: .3rem; min-width: 0; }
  .field-name { color: var(--dim); font-size: .85rem; }
  .field select, .field input[type=number] { max-width: 100%; }
  .field:empty { display: none; }

  /* A MIDI port, read down the card in the direction the notes travel: what it
     is fed by, then what it feeds. The two words carry it - a leg is labelled
     rather than inferred from its position - so an output's note bus reads as
     the source it is and not as somewhere the cables are going. */
  .routes { display: grid; gap: 1rem; }
  .route-side { display: grid; gap: .5rem; align-content: start; }
  .route-side-head { display: flex; gap: .5rem; align-items: center; }
  .route-side-head h3 { margin-right: auto; }
  .route { border: 1px solid var(--line); border-radius: var(--radius);
           padding: .5rem .6rem; display: grid; gap: .4rem; }
  .route-head { display: flex; gap: .5rem; align-items: center; }
  .route-head h4 { margin: 0; margin-right: auto; color: var(--ink); }
  .route-actions { display: flex; gap: .1rem; margin-left: auto; }
  .route-leg { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: .5rem; }
  /* The label sits against the first control of its leg rather than in the
     middle of a leg that has wrapped onto three rows, so the padding is half
     a control's height rather than an alignment. */
  .leg-name { color: var(--dim); font-size: .7rem; text-transform: uppercase;
              letter-spacing: .08em; padding-top: .9rem; }
  .leg-body { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }
  .leg-body > select { flex: 1 1 9rem; max-width: 26rem; }
  .route .wire { margin-left: 2.9rem; }

  /* --- bindings --- */
  .table-scroll, .lane-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; }
  table.bindings { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.bindings th { text-align: left; color: var(--dim); font-weight: 400;
                      border-bottom: 1px solid var(--line); padding: .35rem .5rem .35rem 0; }
  table.bindings td { padding: .45rem .5rem .45rem 0; border-bottom: 1px solid var(--line);
                      vertical-align: top; }
  .bindings-detail { margin-top: .8rem; }
  /* The two halves of the mod matrix, one panel: a knob's CC and a control
     signal, read one under the other. */
  .matrix-half + .matrix-half { margin-top: 1.1rem; padding-top: .9rem;
                                border-top: 1px solid var(--line); }
  details > summary { cursor: pointer; min-height: var(--tap); display: flex;
                      align-items: center; gap: .5rem; color: var(--dim); }
  .binding { border: 1px solid var(--line); border-radius: var(--radius);
             padding: .3rem .6rem; margin-bottom: .5rem; }
  .binding.active > summary { color: var(--ink); }
  .binding-list { margin-top: .5rem; }
  .slot-index { background: var(--line); border-radius: 5px; padding: 0 .45rem;
                color: var(--dim); font-variant-numeric: tabular-nums; }

  /* --- grids --- */
  .grid { margin-top: .9rem; border-top: 1px solid var(--line); padding-top: .8rem; }
  .grid-title { color: var(--dim); font-size: .8rem; margin-bottom: .4rem; }
  /* On a phone a lane *wraps*; it does not scroll. Thirty-two steps in a row
     is four screens wide, and a pattern you have to scroll to see is one you
     cannot read: you lose which step you are on the moment it leaves the
     screen, and the tap that follows lands on the wrong one. So the steps go
     on as many rows as they need, eight to a row - two beats of sixteenths,
     so a wrap always falls where a bar line would - and the lane's name goes
     above it, because the width spent on a name is width taken from the
     steps. The cells then take whatever is left rather than staying 26px on a
     390px screen, which makes them easier to hit as well as to read.

     The wide layout, below, is the one that scrolls: there the whole pattern
     fits on one line, and one line is better still. */
  .lanes { display: grid; gap: .55rem; }
  .lane-row { display: grid; gap: .2rem; }
  .lane-name { color: var(--dim); font-size: .72rem; line-height: 1.25; }
  .lane {
    --per-row: 8;
    display: grid; grid-template-columns: repeat(var(--per-row), minmax(0, 1fr)); gap: 3px;
  }
  .lane.notes { --per-row: 4; }
  .cell {
    height: 30px; min-height: 0; padding: 0; border-radius: 3px;
    background: var(--raised); border: 1px solid var(--line);
  }
  .cell.on { background: var(--gate); border-color: var(--gate); }
  .cell.beyond { opacity: .3; }
  /* Where the running node is, right now. The step being edited and the step
     being played are the same square: that is what makes this one app. */
  .cell.playing, .note-cell.playing { outline: 2px solid var(--accent); outline-offset: 1px; }
  .note-cell {
    display: grid; gap: 1px; text-align: center;
    border: 1px solid var(--line); border-radius: 3px; padding: 2px; background: var(--raised);
  }
  .note-cell.on { border-color: var(--note); }
  .note-cell.beyond { opacity: .35; }
  .note-cell.rest { border-style: dashed; }
  .note-cell.tie { border-color: var(--note); border-style: double; }
  .note-cell input {
    width: 100%; min-height: 1.6rem; background: none; border: none; color: var(--ink);
    font: inherit; font-size: .85rem; text-align: center; padding: 0;
  }
  .note-cell .pitch { font-size: .65rem; color: var(--dim); }

  /* --- the play tab --- */
  /* A jack is a socket: a lamp, a name, and whatever drives it. Cards rather
     than a table, because on a phone a table of eight jacks is a sideways
     scroll and a card is not. */
  .jack-cards { display: grid; gap: .5rem; }
  .jack-card { border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; }
  .jack-head { display: flex; gap: .5rem; align-items: center; margin-bottom: .3rem; }
  .jack-head h4 { margin: 0; }
  /* A jack nothing is patched into is still shown - it is where you go to
     patch something into it - but it does not compete with the ones in use. */
  .jack-card.unused { border-style: dashed; }
  .jack-card .port { margin-top: .5rem; }
  /* A jack carries a gate whichever way it faces, so its lamp is the gate
     colour; the direction is the word beside it. */
  .led.jack-lamp { background: var(--gate); }
  .led.lit { opacity: 1; }

  /* One octave, playable with a thumb. Not a picture of a piano - the black
     keys are in the row, named, because a 26px key on a phone cannot be hit
     between two others - and it wraps rather than scrolls. A key holds
     `touch-action: none` so a drag across the keyboard plays a glissando
     instead of panning something, which also means a finger could never have
     panned the row: scrolling, the octave simply ended at whatever fitted.
     Wrapped, every key is reachable and none is thinner than a thumb. */
  .keys { display: flex; flex-wrap: wrap; gap: 3px; padding-bottom: .3rem; }
  .key { flex: 1 1 3rem; max-width: 8rem; min-height: 3.5rem; font-size: .75rem; touch-action: none; }
  .key.black { background: var(--raised); color: var(--dim); }
  .key.held { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* The scope and the piano roll. A canvas has no intrinsic width, so it is
     given one - the panel's - and its pixel buffer is set from that times the
     device pixel ratio in `scope.js`; a canvas sized in CSS alone is a blurred
     canvas on every phone made since 2014. The height comes from the content
     (one row per trace, a fixed roll) and is written on the element. */
  .scope-wrap { margin-bottom: .6rem; }
  canvas.scope, canvas.roll {
    display: block; width: 100%; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--bg);
  }
  /* A legend: one chip per trace, in the colour the canvas draws it, handed
     over as a custom property because a bus's shade is chosen by its number
     rather than by a class. A chip is a button, and a pressed-out chip is a
     trace put away for the moment. */
  .legend { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .legend-row .legend { margin-top: 0; flex: 1 1 auto; }
  .legend-chip {
    display: inline-flex; align-items: center; gap: .4rem;
    min-height: 2.1rem; padding: .15rem .6rem; border-radius: 999px;
    background: var(--raised); border: 1px solid var(--line); color: var(--ink); font-size: .78rem;
  }
  .legend-chip::before { content: ''; width: 1rem; height: .55rem; border-radius: 2px;
                         background: var(--key, var(--dim)); flex: none; }
  .legend-chip.off { color: var(--dim); text-decoration: line-through; }
  .legend-chip.off::before { opacity: .25; }
  .node-roll canvas.roll { margin-bottom: .2rem; }

  /* One player per box: the source it listens to, its timbre and its level.
     A box rather than a row, because on a phone the three controls wrap and
     two players' worth of wrapped controls in one list is unreadable. */
  .players { display: grid; gap: .6rem; margin-bottom: .6rem; }
  .player { border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; }
  .player > .row { margin-bottom: .3rem; }
  .player p { margin: .2rem 0 0; overflow-wrap: anywhere; }
  h4.spaced { margin-top: 1rem; }

  .log-scroll { max-height: 16rem; overflow-y: auto; -webkit-overflow-scrolling: touch;
                border: 1px solid var(--line); border-radius: var(--radius); }
  .log { display: grid; font-size: .8rem; font-variant-numeric: tabular-nums; }
  .log-line { display: grid; grid-template-columns: 3.5rem 4.5rem 1fr; gap: .4rem;
              padding: .3rem .5rem; border-bottom: 1px solid var(--line); }
  .log-line:last-child { border-bottom: none; }
  .log-time, .log-where { color: var(--dim); }
  .log-where { grid-column: 1 / -1; font-size: .75rem; }

  /* --- the library tab --- */
  .saved-list { display: grid; gap: .5rem; }
  .saved { border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; }
  .saved.current { border-color: var(--accent); }

  /* --- meters --- */
  .meters .meter-row { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
  .led { width: 14px; height: 14px; border-radius: 50%; flex: none; opacity: .08; }
  .led.green { background: var(--gate); box-shadow: 0 0 8px var(--gate); }
  .led.red { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .clock-readout { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 10rem; }
  .gate-dots { display: flex; gap: 3px; flex-wrap: wrap; }
  .gate-dot { width: 9px; height: 16px; border-radius: 2px; background: var(--raised);
              border: 1px solid var(--line); }
  .gate-dot.lit { background: var(--gate); border-color: var(--gate); }

  .slots { display: grid; gap: .5rem; }
  .slot { display: flex; gap: .4rem; align-items: center; }
  .slot span { width: 4rem; color: var(--dim); }
  .slot button { flex: 1 1 auto; }

  textarea.json {
    width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8rem; line-height: 1.45; resize: vertical; white-space: pre;
  }
  /* Text that is not laid out to be read line by line - the schema, and the
     prompt carrying it - is one line long, so it wraps instead of scrolling
     sideways past the edge of the screen. */
  textarea.json.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

  noscript, .fallback { display: block; padding: 1rem; border: 1px solid var(--warn);
                        border-radius: var(--radius); }

  /* --- wider screens. Every rule below only adds columns; nothing here is
         needed for the editor to work. --- */
  /* --- the patch as blocks ---
     The canvas is a picture of the patch, not a second model of it: an arrow
     is drawn wherever a writer and a reader are on one bus, so everything here
     is presentation and nothing here holds state.

     The block geometry comes from layout.js as custom properties on
     .canvas-panel (--blk-w, --blk-head, --blk-row, --blk-pad), because the
     arrows are drawn by arithmetic rather than by measuring the DOM: a socket
     is at the block's edge, level with the middle of its own row, and that is
     only true if these rules use the same numbers the arithmetic does. */
  .canvas-panel { background: var(--panel); border: 1px solid var(--line);
                  border-radius: 10px; padding: .6rem; margin-bottom: 1rem; }
  /* The bar above the picture: what to add and the button that adds it,
     then the zoom. On a phone the zoom wraps under the picker. */
  .canvas-bar { display: flex; gap: .5rem; align-items: center;
                justify-content: space-between; flex-wrap: wrap; margin-bottom: .5rem; }
  .add-row { display: flex; gap: .5rem; align-items: center; flex: 1 1 16rem; }
  .canvas-zoom { display: flex; gap: .25rem; margin-left: auto; }
  .canvas-foot { display: flex; gap: .5rem .9rem; align-items: center; flex-wrap: wrap;
                 justify-content: space-between; margin-top: .6rem; }
  .canvas-foot .canvas-legend { margin-top: 0; }

  /* The details panel: one bar, then the card. The bar stays when the body
     is folded, so a folded panel is a line saying what is selected. */
  .details-bar { display: flex; gap: .4rem; align-items: center; margin-bottom: .8rem; flex-wrap: wrap; }
  .details.folded .details-bar { margin-bottom: 0; }
  .details-title { margin: 0; flex: 1 1 auto; color: var(--ink); font-size: .95rem;
                   text-transform: none; letter-spacing: 0; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .details-close { margin-left: auto; }
  .details .node { border: none; padding: 0; background: none; }
  .details .nodes { gap: 0; }

  /* A fixed window onto a world that is as big as the patch needs. The pan and
     the zoom are a transform on .canvas-world, so nothing scrolls and the page
     around it is never dragged sideways.

     touch-action: none is what makes a one-finger drag pan the canvas instead
     of scrolling the page - which is also why the canvas has a bounded height:
     a full-page canvas on a phone would be a page you cannot scroll past. */
  .canvas-view {
    position: relative; overflow: hidden; height: clamp(19rem, 58vh, 38rem);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size: 24px 24px;
    touch-action: none; cursor: grab;
    user-select: none; -webkit-user-select: none;
  }
  .canvas-view.panning { cursor: grabbing; }
  .canvas-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  svg.wires { position: absolute; top: 0; left: 0; overflow: visible; }

  /* Domains, everywhere: an arrow, a socket and a bus chip of the same colour
     are the same kind of signal, and the colours are the ones the node cards
     have always used for a bus. */
  .dom-gate { --wire: var(--gate); }
  .dom-note { --wire: var(--note); }
  .dom-CV   { --wire: var(--cv); }

  .wire { fill: none; stroke: var(--wire); stroke-width: 2; stroke-linecap: round;
          opacity: .8; pointer-events: none; }
  .wire.selected { stroke-width: 3.5; opacity: 1; }
  /* Two sources on one bus: the signals are summed by the bus, not by a node
     that says so, which is worth seeing without counting arrowheads. */
  .wire.merged { stroke-dasharray: 8 4; }
  /* A gate bus that is high right now, sampled once per pass like every other
     live thing in this page. */
  .wire.lit { opacity: 1; stroke-width: 4; }
  .wire.ghost { stroke-dasharray: 5 5; opacity: .7; }
  .wire.ghost.over { stroke-width: 3.5; opacity: 1; stroke-dasharray: none; }
  /* A two-pixel curve is not something a finger can hit. */
  .wire-hit { stroke: transparent; stroke-width: 20; fill: none;
              pointer-events: stroke; cursor: pointer; }
  .wire-cut {
    position: absolute; transform: translate(-50%, -50%);
    height: 2rem; width: 2rem; border-radius: 999px;
    border-color: var(--bad); color: var(--bad); background: var(--panel);
  }
  .wire-cut .icon { width: 1.1rem; height: 1.1rem; }

  .blk {
    position: absolute; width: var(--blk-w);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    cursor: grab; touch-action: none;
  }
  .blk.moving { cursor: grabbing; opacity: .92; z-index: 3; }
  .blk.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); z-index: 2; }
  .blk.bad { border-color: var(--bad); }
  .blk.kind-jack, .blk.kind-midiIn, .blk.kind-midiOut { background: var(--raised); }
  .blk-head {
    height: var(--blk-head); display: flex; align-items: center; gap: .35rem;
    padding: 0 .2rem 0 .5rem; border-bottom: 1px solid var(--line);
  }
  .blk-index { background: var(--line); border-radius: 4px; padding: 0 .35rem;
               color: var(--dim); font-size: .72rem; font-variant-numeric: tabular-nums; }
  .blk-title { flex: 1 1 auto; min-width: 0; font-size: .85rem;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blk-clocked { color: var(--accent); font-size: .8rem; }
  .blk-remove { height: 1.75rem; width: 1.75rem;
                background: none; border-color: transparent; color: var(--dim); }
  .blk-remove .icon { width: .95rem; height: .95rem; }
  .blk-remove:hover { color: var(--bad); border-color: var(--bad); }

  .blk-body { display: flex; padding: var(--blk-pad) 0; }
  .blk-col { flex: 1 1 50%; min-width: 0; }
  .blk-port { position: relative; height: var(--blk-row);
              display: flex; align-items: center; gap: .25rem; padding: 0 .5rem; }
  .blk-port.out { justify-content: flex-end; }
  .blk-port-name { min-width: 0; font-size: .72rem; color: var(--dim);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blk-port-name .required { color: var(--warn); }
  .blk-port-bus { flex: none; font-size: .65rem; color: var(--wire);
                  border: 1px solid var(--wire); border-radius: 4px; padding: 0 .25rem;
                  font-variant-numeric: tabular-nums; opacity: .8; }

  /* The socket is a 26px target around an 11px dot, because the dot is what
     the arrow points at and the target is what a finger hits. */
  .socket {
    position: absolute; width: 26px; height: 26px; min-height: 0; padding: 0;
    background: none; border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: crosshair; touch-action: none;
  }
  .blk-port.in .socket { left: -13px; }
  .blk-port.out .socket { right: -13px; }
  .socket:hover { background: color-mix(in srgb, var(--wire) 22%, transparent); }
  .socket .dot { width: 11px; height: 11px; border-radius: 50%;
                 border: 2px solid var(--wire); background: var(--bg); }
  .socket.on .dot { background: var(--wire); }
  .socket.needed .dot { border-color: var(--warn); }
  /* Mid-drag, only the sockets that could take this connection are lit. The
     module refuses a domain mismatch, so offering one is a lie. */
  .canvas-view.linking .socket { opacity: .25; }
  .canvas-view.only-gate .socket.dom-gate,
  .canvas-view.only-note .socket.dom-note,
  .canvas-view.only-CV .socket.dom-CV { opacity: 1; }

  /* A modulated parameter is a socket the patch grew, not one the algorithm
     has: a square dot says "this is a parameter, not a port" at a glance,
     without a second colour to learn. */
  .socket.mod .dot { border-radius: 3px; }
  .blk-port.mod .blk-port-name { font-style: italic; }

  /* The dropdown that finishes a modulation drag. Fixed to the viewport
     because it is opened at the pointer, which is in client coordinates -
     the canvas is panned and zoomed under it and the menu must not be. */
  .param-menu {
    position: fixed; z-index: 60; transform: translate(-8px, -8px);
    min-width: 13rem; max-width: 18rem; max-height: 60vh;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); overflow: hidden;
  }
  .param-menu-head { padding: .45rem .6rem; font-size: .7rem; color: var(--dim);
                     border-bottom: 1px solid var(--line); }
  .param-menu-list { overflow-y: auto; }
  .param-menu-item {
    display: flex; width: 100%; gap: .6rem; align-items: baseline;
    justify-content: space-between; padding: .4rem .6rem; min-height: 2rem;
    background: none; border: none; border-radius: 0; text-align: left;
    font-size: .8rem; cursor: pointer;
  }
  .param-menu-item:hover, .param-menu-item:focus {
    background: color-mix(in srgb, var(--cv) 22%, transparent); outline: none;
  }
  .param-menu-range { flex: none; font-size: .68rem; color: var(--dim); }
  /* A row of the menu that is a control rather than a choice: the CC number,
     which is 120 of them and a list nobody should scroll. */
  .param-menu-field { display: flex; gap: .6rem; align-items: center; padding: .45rem .6rem;
                      border-top: 1px solid var(--line); }
  .param-menu-field select { flex: 1 1 auto; min-width: 0; }
  /* The CC menu is the accent's, as the CV menu is the CV colour's: what a
     menu binds to is the colour it highlights in. */
  .param-menu.cc .param-menu-item:hover, .param-menu.cc .param-menu-item:focus {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .canvas-legend { display: flex; gap: .4rem; align-items: center;
                   flex-wrap: wrap; margin-top: .6rem; }
  .chip.dom-gate, .chip.dom-note, .chip.dom-CV { color: var(--wire);
    border-color: color-mix(in srgb, var(--wire) 55%, transparent); }
  .canvas-legend .chip { min-height: 1.9rem; font-size: .75rem; color: var(--wire);
                         border-color: color-mix(in srgb, var(--wire) 55%, transparent); }
  .canvas-legend .merge { color: var(--dim); }

  @media (min-width: 34rem) {
    .shell { padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.25rem; }
    .top { grid-template-columns: 1fr auto; align-items: center; }
    .top-buttons { justify-content: flex-end; }
    .top-buttons button { flex: 0 0 auto; }
    .status { grid-column: 1 / -1; }
    .tab { flex: 0 0 auto; flex-direction: row; gap: .45rem; padding: 0 .9rem; }
    .tab .icon { width: 1.1rem; height: 1.1rem; }
    .tab-label { font-size: inherit; }
    /* Two parameters to a row only where a row can hold two whole ones: a
       slider, its number field and the two icon buttons need this much, and a
       column any narrower wraps the buttons under the slider and makes the
       card taller than the single column it replaced. */
    .params { grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: .6rem 1.5rem; }
    .fields { grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
    .jack-cards { grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
    .log-line { grid-template-columns: 4rem 5rem 1fr auto; }
    .log-where { grid-column: auto; }
    .slots { grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
    /* Twice the room, so twice the steps to a row - still a power of two, so
       still a bar line. */
    .lane-name { font-size: .8rem; }
    .lane { --per-row: 16; }
    .lane.notes { --per-row: 8; }
  }
  @media (min-width: 52rem) {
    .canvas-view { height: clamp(24rem, 62vh, 44rem); }
    .ports { grid-template-columns: 1fr 1fr; gap: .8rem 1.5rem; }
    .routes { grid-template-columns: 1fr 1fr; align-items: start; }
    .port-head { grid-template-columns: 8rem 1fr; }
    .param.inline { grid-template-columns: 8rem 1fr; }
    /* Wide enough for the whole pattern on one line, which is how a pattern
       is meant to be read: every lane in one scroller so they stay in step
       with each other, the names beside them rather than above, and stuck to
       the left edge so they survive the scroll that is left. */
    .lanes { width: max-content; min-width: 100%; }
    .lane-row { display: flex; gap: .4rem; align-items: center; width: max-content; }
    .lane-name {
      position: sticky; left: 0; z-index: 1; flex: none;
      width: 8rem; padding-right: .3rem; background: var(--panel);
    }
    .lane { display: flex; gap: 3px; width: max-content; padding-bottom: 2px; }
    .cell { width: 26px; flex: none; }
    .note-cell { width: 52px; flex: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tab, button, .chip { transition: border-color .12s ease, background .12s ease, color .12s ease; }
    .learn.armed { animation: waiting 1.1s ease-in-out infinite; }
    @keyframes waiting { 50% { opacity: .4; } }
  }
</style>
