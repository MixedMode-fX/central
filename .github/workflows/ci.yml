name: CI

# One run per commit, never two. A branch pushed here and then opened as a
# pull request is the same commit arriving twice, so `push` is main only and
# every branch is covered by its pull request; `workflow_dispatch` runs a
# branch that has not got one yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's ref is refs/pull/N/merge and a push's is refs/heads/main,
# so this cancels superseded runs within one pipeline without letting either
# cancel the other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything the commit gate covers, by the same name and the same script.
  checks:
    uses: ./.github/workflows/checks.yml

  # Not in the gate: it needs the ARM toolchain, and what it proves - that the
  # thing fits on the board and links against the Teensy core - is not
  # something a host build can tell you.
  firmware:
    name: Teensy 4.1 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.py runs `git describe`, which needs tags and
          # history that a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-

      - name: Install PlatformIO
        run: scripts/bootstrap.sh

      - name: Build firmware
        run: make build

      - name: Report size
        run: make size

      # Every build is downloadable, so a branch can be flashed and tried on
      # hardware without cutting a release for it. On a pull_request event
      # github.sha is the ephemeral merge commit, which names no commit on the
      # branch, so prefer the head SHA — the point of the artifact is to be
      # traceable to something you can check out.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .pio/build/teensy41/*.hex
            .pio/build/teensy41/*.elf
          if-no-files-found: error
          retention-days: 14

  # The module as a VST3 for Windows (plugin/README.md). Not in the gate for
  # the reason the firmware is not: it fetches and builds a plugin framework
  # on a runner with the toolchain for it. The engine inside it is what the
  # gate already tested with a host compiler; this proves the same core
  # compiles under MSVC and links into a plugin a DAW can load.
  vst3:
    name: VST3 for Windows
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # plugin/CMakeLists.txt stamps `git describe` into the plugin as
          # scripts/version.py does into the firmware.
          fetch-depth: 0

      # The editor is the page the checks job just built and uploaded: one
      # file, the module inlined. Built once, by the tools that build it,
      # rather than a second time with a Windows clang.
      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.pull_request.head.sha || github.sha }}
          path: emulator/dist

      # WebView2 is how the page is shown on Windows, and its loader is
      # linked statically, so the NuGet package with the header and the
      # library has to be on the disk at build time. JUCE looks for it where
      # JUCE_WEBVIEW2_PACKAGE_LOCATION points (extras/Build/CMake/FindWebView2.cmake).
      - name: Fetch the WebView2 package
        shell: pwsh
        run: |
          $version = "1.0.3485.44"
          $dir = Join-Path $env:RUNNER_TEMP "webview2"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $nupkg = Join-Path $dir "Microsoft.Web.WebView2.$version.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath (Join-Path $dir "Microsoft.Web.WebView2.$version") -Force
          "WEBVIEW2_PACKAGES=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: >
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
          -DMMMC_APP_PAGE="${{ github.workspace }}/emulator/dist/index.html"
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:WEBVIEW2_PACKAGES"

      # The engine's test under MSVC first: the same test the gate ran with
      # GCC, on the compiler the plugin ships from.
      - name: Engine test
        shell: pwsh
        run: |
          cmake --build plugin/build --config Release --target engine_test
          plugin/build/Release/engine_test.exe

      - name: Build the VST3
        shell: pwsh
        run: cmake --build plugin/build --config Release --target mmmc_VST3

      # The bundle, whole: a folder a DAW loads from its VST3 directory.
      - name: Upload the VST3
        uses: actions/upload-artifact@v4
        with:
          name: vst3-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: plugin/build/mmmc_artefacts/Release/VST3/MMMC.vst3
          if-no-files-found: error
          retention-days: 14
