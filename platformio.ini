; PlatformIO Project Configuration File
;
;   Build firmware   : make build        (pio run -e teensy41)
;   Run unit tests   : make test         (pio test -e native)
;   Flash a Teensy   : make upload       (pio run -e teensy41 -t upload)
;
; https://docs.platformio.org/page/projectconf.html
;
; Every dependency is pinned to an exact version so that a cold PlatformIO cache
; resolves the same packages as any other machine. Bump them deliberately.

[platformio]
default_envs = teensy41

[env]
; Stamps MMMC_VERSION / MMMC_GIT_REV / MMMC_BUILD into the build from the
; VERSION file plus `git describe`. See scripts/version.py and src/version.h.
; project_warnings.py adds -Weffc++ (C++-only) to the project's C++ sources,
; so the C test-framework sources compiled alongside them are not given it.
extra_scripts =
  pre:scripts/version.py
  post:scripts/project_warnings.py
; Warnings apply to *our* sources (build_src_flags). Framework and library code
; is compiled with its own flags; third-party headers are wrapped in
; src/hal/teensy/teensy_includes.h so they do not trip -Weffc++ in our units.
build_src_flags =
  -Wall
  -Wextra
  -Wshadow
  -Werror

[env:teensy41]
; Pinned deliberately: the Teensy core ships MIDI Library and USBHost_t36, so
; the platform version is what makes those dependencies reproducible. Bumping
; this line is a deliberate act, and the CI build is what proves it is safe.
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
; MMMC_USB_HOST compiles in the USB host port (USBHost_t36). Remove it to
; build without host support; ALL_MIDI_PORTS follows automatically.
build_flags =
  -D USB_MIDI4_SERIAL
  -D MMMC_USB_HOST

[env:native]
; Host build of everything that does not touch the Teensy: used by
; `pio test -e native`. Runs anywhere, with no Teensy attached.
platform = native@1.2.1
test_framework = unity
; Pinned for the same reason as the platform: an unpinned Unity would make two
; runs of the same commit resolve different test frameworks.
lib_deps = throwtheswitch/Unity@2.6.1
; The hardware layer and main.cpp are excluded; everything else is framework-free.
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<hal/teensy/>
build_flags =
  -std=gnu++17
