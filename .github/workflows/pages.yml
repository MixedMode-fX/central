name: Pages

# Publishes the browser emulator (emulator/README.md) and the patch editor
# (editor/README.md) to GitHub Pages, so the current firmware can be tried at
# https://mixedmode-fx.github.io/central/ with nothing to download, and a
# module can be configured at .../editor/ .
#
# Pages is what makes the editor usable at all: Web MIDI needs a secure
# context, so a file:// copy cannot reach a module. Pages must be set to
# deploy from GitHub Actions in the repository settings.
#
# Every push to main redeploys. Run it by hand (workflow_dispatch) on any
# branch to put that branch's build on the site instead, e.g. to try a pull
# request; the next push to main puts main back. The build itself is the
# same as the `emulator` job in ci.yml, so a branch that is green there will
# deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one is not cancelled so the newest
# commit always ends up on the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps `git describe` into the page like the firmware.
          fetch-depth: 0

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Build
        run: emulator/build.sh

      - name: Smoke test the module
        run: node emulator/test/smoke.mjs

      - name: Check the editor against the firmware
        run: |
          node editor/tools/generate-protocol.mjs --check
          node editor/test/protocol.test.mjs

      # The editor is served from /editor/ alongside the emulator. It has no
      # build step - ES modules and one HTML file - so the page and its
      # modules are copied as they are. The generator and the test are build
      # tooling and are not part of the site.
      - name: Stage the editor
        run: |
          mkdir -p emulator/dist/editor
          cp editor/index.html editor/README.md emulator/dist/editor/
          cp -r editor/src emulator/dist/editor/src

      # index.html plus mmmc.wasm: the page fetches the module from next to
      # itself when served and falls back to its embedded copy otherwise.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: emulator/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
