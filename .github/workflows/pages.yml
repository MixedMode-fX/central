name: Pages

# Publishes the app (app/README.md) to GitHub Pages, so a module can be
# configured - and the current firmware tried, with no module at all - at
# https://mixedmode-fx.github.io/central/ with nothing to download.
#
# Pages is what makes the app able to reach hardware: Web MIDI needs a secure
# context, so a file:// copy cannot talk to a module. Pages must be set to
# deploy from GitHub Actions in the repository settings.
#
# Every push to main redeploys. Run it by hand (workflow_dispatch) on any
# branch to put that branch's build on the site instead, e.g. to try a pull
# request; the next push to main puts main back. The build is `scripts/checks.sh
# app`, the same script the commit hook and CI run, so a branch that is green
# there will deploy - and a red one is never published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one is not cancelled so the newest
# commit always ends up on the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps `git describe` into the page like the firmware.
          fetch-depth: 0

      # See checks.yml: a third-party source on the runner image must not be
      # able to fail this before a package is fetched.
      - name: Install clang and lld
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update || true
          sudo apt-get install -y clang lld llvm

      # Builds emulator/dist and checks it: the module against the test_master
      # scenarios, the generated protocol against the firmware headers, and the
      # app's own suites against the module. Silence is the pass.
      - name: Build and check the app
        run: bash scripts/checks.sh app

      # index.html plus mmmc.wasm: the page fetches the module from next to
      # itself when served and falls back to its embedded copy otherwise.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: emulator/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
